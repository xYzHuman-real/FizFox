services:
  fizfox-api:
    build: ./backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      FIZFOX_DB_PATH: /data/fizfox.db
    volumes:
      - fizfox-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev

volumes:
  fizfox-data:
