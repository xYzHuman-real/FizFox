services:
  - type: web
    name: fizfox-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: FIZFOX_AI_BASE_URL
        sync: false
      - key: FIZFOX_AI_API_KEY
        sync: false
      - key: FIZFOX_AI_MODEL
        sync: false
      - key: FIZFOX_AI_TIMEOUT
        value: "60"
      - key: FIZFOX_ALLOWED_ORIGINS
        sync: false
